name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.20.0', '24']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck -s sh ../site/install.sh
      - run: npm run test:all
