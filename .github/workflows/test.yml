name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run test:all
